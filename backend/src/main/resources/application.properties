# =============================================================================
# application.properties: settings Spring Boot reads when the app starts.
# MERN equivalent: the config values you'd load from .env or config.js.
# This file is committed to git, so never put passwords or AWS keys in it.
# =============================================================================

# The app's name. It shows up in every log line, e.g. [stay-the-course].
spring.application.name=stay-the-course

# Reject decimals for whole-number fields. Without this, the JSON reader would
# quietly turn "years": 30.5 into 30 instead of rejecting the request.
spring.jackson.deserialization.accept-float-as-int=false

# The server runs on port 8080 by default. To change it, add: server.port=9090
