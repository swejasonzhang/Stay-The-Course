# Spring Boot settings, read at startup. This file is committed, so never put secrets here.
spring.application.name=stay-the-course

# Reject decimals for whole-number fields ("years": 30.5) instead of truncating them.
spring.jackson.deserialization.accept-float-as-int=false

# Frontend origins allowed to call this API from a browser (comma-separated).
# Override in production with the APP_CORS_ALLOWEDORIGINS environment variable.
app.cors.allowed-origins=http://localhost:5173
