[project]
name = "stay-the-course"
version = "0.1.0"
description = "Finance engine and API for Stay the Course"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.158.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
